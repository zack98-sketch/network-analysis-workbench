- name: SSH弱密钥交换算法diffie-hellman-group1
  rule_type: config
  trigger:
    section_type: ssh
    conditions:
      - key: ".*(dh-exchange|key-exchange).*"
        op: regex_contains
        value: "dh_group1|diffie-hellman-group1"
  severity: high
  description: SSH配置使用存在密码学弱点的diffie-hellman-group1密钥交换算法，易遭受Logjam攻击。
  remediation_cmd: |
    undo ssh server dh-exchange group dh_group1
    ssh server key-exchange dh_group14_sha256 dh_group16_sha512 curve25519_sha256
  standard_ref: 等保2.0三级 8.1.3.2 / GB/T 22239-2019

- name: SSH兼容SSH1.x协议
  rule_type: config
  trigger:
    section_type: ssh
    conditions:
      - key: "ssh"
        op: contains
        value: "compatible-ssh1x"
  severity: high
  description: 启用SSH1.x兼容模式，SSH1协议存在已知CRC-32补偿攻击等严重漏洞。
  remediation_cmd: |
    undo ssh compatible-ssh1x
  standard_ref: 等保2.0三级 8.1.3.2

- name: SSH弱加密算法3DES/DES
  rule_type: config
  trigger:
    section_type: ssh
    conditions:
      - key: ".*cipher.*"
        op: regex_contains
        value: "3des-cbc|des-cbc"
  severity: high
  description: SSH启用了3DES或DES等弱加密算法，存在被破译风险。
  remediation_cmd: |
    ssh server cipher aes256_ctr aes192_ctr aes128_ctr aes256_gcm aes128_gcm
  standard_ref: 等保2.0三级 8.1.3.2

- name: Telnet服务启用
  rule_type: config
  trigger:
    section_type: service
    conditions:
      - key: "telnet"
        op: contains
        value: "server enable"
  severity: high
  description: 启用Telnet服务，所有通信（包括账号密码）均以明文传输，极易被嗅探。
  remediation_cmd: |
    undo telnet server enable
    undo telnet server ipv4 enable
    ssh server enable
  standard_ref: 等保2.0三级 8.1.3.2

- name: SNMP默认团体名public/private
  rule_type: config
  trigger:
    section_type: snmp
    conditions:
      - key: "snmp-agent.*community"
        op: regex_contains
        value: "public|private"
  severity: medium
  description: SNMP使用默认团体名public/private，攻击者可轻易读取或修改设备信息。
  remediation_cmd: |
    undo snmp-agent community read public
    undo snmp-agent community write private
    snmp-agent community read <复杂只读团体名>
    snmp-agent community write <复杂读写团体名> acl <SNMP访问ACL编号>
    snmp-agent sys-info version v3
  standard_ref: 等保2.0三级 8.1.2.3

- name: 安全策略permit未配置源区域和源地址
  rule_type: config
  trigger:
    section_type: security_policy
    conditions:
      - key: "action"
        op: contains
        value: "permit"
      - key: "source-zone"
        op: missing
        value: ""
      - key: "source-address"
        op: missing
        value: ""
  severity: high
  description: 安全策略动作permit但未配置源安全区域和源地址，等价于允许所有流量通过，严重违背最小权限原则。
  remediation_cmd: |
    security-policy
     rule name <策略名>
      source-zone <源安全区域>
      source-address <源地址对象/网段>
      destination-zone <目的安全区域>
      destination-address <目的地址>
      service <服务对象>
      action permit
  standard_ref: 等保2.0三级 8.1.3.3 / GB/T 22239-2019

- name: admin用户权限15未绑定ACL
  rule_type: config
  trigger:
    section_type: aaa
    conditions:
      - key: "local-user admin privilege level"
        op: contains
        value: "15"
      - key: ".*acl.*"
        op: missing_in_section
        value: ""
  severity: medium
  description: 管理员账户privilege level 15未绑定访问控制ACL，任意可达IP均可尝试管理员登录。
  remediation_cmd: |
    acl number 2000
     rule permit source <管理IP网段> 0
     rule deny
    local-user admin service-type ssh terminal
    user-interface vty 0 4
     acl 2000 inbound
     authentication-mode aaa
     protocol inbound ssh
  standard_ref: 等保2.0三级 8.1.2.2

- name: 本地用户密码明文(simple)
  rule_type: config
  trigger:
    section_type: aaa
    conditions:
      - key: "local-user.*password"
        op: regex_contains
        value: "simple"
  severity: medium
  description: 使用password simple方式以明文保存本地用户密码，配置文件泄露即直接暴露凭据。
  remediation_cmd: |
    local-user <用户名> password cipher <强密码>
    local-user <用户名> password irreversible-cipher <强密码>
  standard_ref: 等保2.0三级 8.1.2.2

- name: 设备未配置日志记录
  rule_type: config
  trigger:
    section_type: system
    conditions:
      - key: "info-center"
        op: missing
        value: ""
      - key: ".*logging.*"
        op: missing_in_section
        value: ""
  severity: medium
  description: 未配置info-center或日志服务器，设备运行、操作、安全事件无法留存，违反审计与溯源要求。
  remediation_cmd: |
    info-center enable
    info-center loghost <日志服务器IP> channel loghost
    info-center source default channel loghost log level informational
    info-center timestamp log format-date
  standard_ref: 等保2.0三级 8.1.4.1

- name: NTP未启用认证
  rule_type: config
  trigger:
    section_type: system
    conditions:
      - key: "ntp-service.*server"
        op: regex_not_contains
        value: "authentication-key|key-id|prefer"
      - key: "ntp-service enable"
        op: missing
        value: ""
  severity: low
  description: NTP服务未启用认证机制，攻击者可通过伪造NTP响应进行时间篡改，导致日志时间线紊乱、证书校验异常。
  remediation_cmd: |
    ntp-service enable
    ntp-service authentication enable
    ntp-service authentication-keyid <ID> authentication-mode hmac-sha256 <密钥>
    ntp-service reliable authentication-keyid <ID>
    ntp-service unicast-server <NTP服务器IP> authentication-keyid <ID>
  standard_ref: 等保2.0三级 8.1.1.2
